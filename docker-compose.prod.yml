# Production overrides. Copy .env.production.example to .env and replace every
# placeholder before evaluating or starting this configuration.
services:
  db:
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}

  backend:
    command:
      - gunicorn
      - booking.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --timeout=60
      - --access-logfile=-
      - --error-logfile=-
    volumes: !reset []
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: booking.settings_production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "False"
      PAYMENT_MODE: demo
      ALLOW_DEMO_SEED: "false"
      ALLOW_DEPLOYMENT_DEMO_SEED: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"

  frontend:
    build:
      args:
        REACT_APP_API_BASE: ${REACT_APP_API_BASE:?Set REACT_APP_API_BASE in .env}
