# Disposable Render demo environment. This is not a durable production topology.
# Sync it from the revamp-trainline branch and review every proposed resource
# before clicking Deploy Blueprint.

services:
  - type: web
    name: hs14235-trainline-api-demo
    runtime: docker
    plan: free
    autoDeployTrigger: off
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /readyz
    initialDeployHook: >-
      ALLOW_DEMO_SEED=True ALLOW_DEPLOYMENT_DEMO_SEED=True
      python manage.py seed_demo --temporary-deployment-demo
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: booking.settings_production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hs14235-trainline-db-demo
          property: connectionString
      - key: ALLOWED_HOSTS
        value: hs14235-trainline-api-demo.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://hs14235-trainline-web-demo.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hs14235-trainline-web-demo.onrender.com
      - key: CORS_ALLOW_CREDENTIALS
        value: "False"
      - key: TRUST_X_FORWARDED_PROTO
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: PAYMENT_MODE
        value: demo
      - key: ALLOW_DEMO_SEED
        value: "False"
      - key: ALLOW_DEPLOYMENT_DEMO_SEED
        value: "False"
      - key: DEMO_USER_USERNAME
        value: trainline-demo
      - key: DEMO_USER_EMAIL
        value: trainline-demo@example.test
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"
      - key: COLLECT_STATIC
        value: "true"
      - key: PORT
        value: "8000"

  - type: web
    name: hs14235-trainline-web-demo
    runtime: static
    autoDeployTrigger: off
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_BASE
        value: https://hs14235-trainline-api-demo.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
          img-src 'self' data: https:; font-src 'self' data:;
          connect-src 'self' https://hs14235-trainline-api-demo.onrender.com

databases:
  - name: hs14235-trainline-db-demo
    plan: free
    databaseName: trainline_demo
    user: trainline_demo
    ipAllowList: []
