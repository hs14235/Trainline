version: "3.9"
services:
  db:
    image: postgres:14-alpine
    container_name: trainline-db
    environment:
      - POSTGRES_USER=trainline_user
      - POSTGRES_PASSWORD=trainline_pass
      - POSTGRES_DB=trainline_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainline_user -d trainline_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    ports: 
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    container_name: trainline-backend
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DJANGO_DEBUG=True
      - ALLOWED_HOSTS=0.0.0.0,127.0.0.1,localhost
      - DATABASE_URL=postgresql://trainline_user:trainline_pass@db:5432/trainline_db
      - SPECTACULAR_TITLE=Trainline API
      - SPECTACULAR_VERSION=1.0.0
    restart: unless-stopped

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    container_name: trainline-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
