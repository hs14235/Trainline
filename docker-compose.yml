version: "3.9"
services:
  db:
    image: postgres:14-alpine
    container_name: trainline-db
    environment:
      - POSTGRES_USER=trainline_user
      - POSTGRES_PASSWORD=trainline_pass
      - POSTGRES_DB=trainline_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
   
    restart: unless-stopped
    

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    ports: 
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    container_name: trainline-backend
    environment:
      - DJANGO_DEBUG=False
      - ALLOWED_HOSTS=0.0.0.0,127.0.0.1,localhost,your-domain.com,api.your-domain.com
      - CORS_ALLOWED_ORIGINS=https://your-domain.com
      - CSRF_TRUSTED_ORIGINS=https://your-domain.com
    restart: unless-stopped

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    container_name: trainline-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
