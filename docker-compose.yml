version: "3.9"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: trainline_db
      POSTGRES_USER: trainline_user
      POSTGRES_PASSWORD: trainline_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trainline_net

  backend:
    build:
      context: ./backend
    command: gunicorn booking.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    networks:
      - trainline_net

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - trainline_net

volumes:
  postgres_data:

networks:
  trainline_net:
