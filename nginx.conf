server {
    listen 80;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy
    # Note: 'unsafe-inline' is used for React inline styles. In production, consider:
    # 1. Using nonces for inline scripts: script-src 'self' 'nonce-{random}'
    # 2. Moving all inline styles to CSS files
    # 3. Restricting connect-src to specific API domains
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http://localhost:8000;" always;
    
    # Remove server version exposure
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
    
    # Prevent access to hidden files
    location ~ \. {
        deny all;
        access_log off;
        log_not_found off;
    }
}