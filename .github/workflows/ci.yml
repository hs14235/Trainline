name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: trainline_test_user
          POSTGRES_PASSWORD: trainline_test_password
          POSTGRES_DB: trainline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainline_test_user -d trainline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_ENV: test
      DJANGO_SETTINGS_MODULE: booking.settings_test
      DJANGO_SECRET_KEY: ci-only-demo-secret-key-never-use-in-production
      TEST_DATABASE_URL: postgresql://trainline_test_user:trainline_test_password@127.0.0.1:5432/trainline_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check Django configuration and migrations
        run: python scripts/tasks.py check

      - name: Check backend formatting
        run: python scripts/tasks.py format-check

      - name: Lint backend
        run: python scripts/tasks.py lint-backend

      - name: Scan backend source for common security issues
        run: python -m bandit -r backend/core backend/booking -x backend/core/migrations -q

      - name: Audit backend runtime dependencies
        run: python -m pip_audit -r backend/requirements.txt

      - name: Run fast tests with coverage
        run: python scripts/tasks.py coverage

      - name: Run PostgreSQL integration tests
        run: python scripts/tasks.py test-postgres

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        run: python scripts/tasks.py frontend-lint

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests
        run: python scripts/tasks.py frontend-test

      - name: Build frontend
        run: python scripts/tasks.py frontend-build
